server:
  listen_addr: ":993"
  backend_imap_addr: "imap-backend:143"
  cert_file: "cert.pem"
  key_file: "key.pem"

# Bind to loopback unless a trusted monitoring network is configured.
metrics:
  listen_addr: "127.0.0.1:9090"

redis:
  addr: "imap-redis:6379"
  queue_buffer_size: 10000

logging:
  level: "info"

security:
  mode: "transparent"
  # Only active in defender mode. Limit connection attempts per source IP.
  rate_limit:
    enabled: false
    per_minute: 60
    burst: 20
    except_cidrs: []
  geoip_db_path: "/geoip/GeoLite2-Country.mmdb"
  thresholds:
    tarpit_soft: 30
    tarpit_hard: 60
    drop: 90
  weights:
    ja4_unknown: 25
    geo_anomaly: 35
