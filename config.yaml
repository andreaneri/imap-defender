server:
  listen_addr: ":993"
  backend_imap_addr: "imap-backend:143"
  cert_file: "cert.pem"
  key_file: "key.pem"

# Bind to loopback unless a trusted monitoring network is configured.
metrics:
  listen_addr: "127.0.0.1:9090"

redis:
  addr: "imap-redis:6379"
  queue_buffer_size: 10000

logging:
  level: "info"

security:
  mode: "transparent"
  # Defender shadow diagnostics only; these values do not enable enforcement.
  # Omitted fields keep the defaults below. Delays must be duration strings.
  account_policy:
    soft_failures: 3
    hard_failures: 8
    block_global_failures: 20
    block_country_failures: 12
    soft_delay: 1s
    hard_delay: 8s
  # Only active in defender mode. Scope is ip (legacy) or ja4_ip.
  # A missing JA4 uses IP-only limiting; CIDR exceptions apply to both scopes.
  rate_limit:
    scope: ja4_ip
    enabled: false
    per_minute: 60
    burst: 20
    except_cidrs: []
  # Defender-only response completion pacing; ignored in other modes.
  # Delay includes the bounded Redis lookup. Blocks remain inactive.
  account_pacing:
    enabled: false
    soft_failures: 3
    hard_failures: 8
    soft_delay: 250ms
    hard_delay: 1s
    max_delay: 1s
    max_concurrent: 64
  geoip_db_path: "/geoip/GeoLite2-Country.mmdb"
  thresholds:
    tarpit_soft: 30
    tarpit_hard: 60
    drop: 90
  weights:
    ja4_unknown: 25
    geo_anomaly: 35
