name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: make test

      - name: Benchmark rate limiter
        run: go test -run=^$ -bench=BenchmarkIPRateLimiter -benchmem -benchtime=100ms .

      - name: Build local binary
        run: make build-local

      - name: Build Linux binary
        run: make build-linux
